name: Build APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Numéro de version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"; V="${V#v}"
          else
            V="0.0.${{ github.run_number }}-dev"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_B64 absent : APK signé avec une clé de test, les mises à jour ne fonctionneront pas."
          fi
          if [ -z "${{ vars.TWITCH_CLIENT_ID }}" ]; then
            echo "::warning::Variable TWITCH_CLIENT_ID absente : l’app démarrera en mode démo."
          fi

      - name: Compilation
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: twitchultimate
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l’APK
        run: cp app/build/outputs/apk/release/app-release.apk twitch-ultimate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: twitch-ultimate-apk
          path: twitch-ultimate.apk

      - name: Attacher l’APK à la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: twitch-ultimate.apk
