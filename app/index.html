<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Twitch Ultimate</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="stage">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="topbar">
      <div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c39bff"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><rect x="2" y="2" width="44" height="44" rx="12" fill="url(#lg)"/><path d="M19 14.5v19l15-9.5z" fill="#fff"/></svg>Twitch Ultimate</div>
      <div class="tb-right"><span id="clock"></span><span id="me" class="ava" style="width:56px;height:56px"></span></div>
    </div>
    <div class="view" id="v-home"><div class="scroller" id="home-scroll" data-scroll="y" data-mode="align" data-pad="150"></div></div>
    <div class="view" id="v-today"><div class="page" id="today-page"></div></div>
    <div class="view" id="v-following"><div class="page" id="fol-page" data-scroll="y" data-mode="near"></div></div>
    <div class="view" id="v-cats"><div class="page" id="cats-page" data-scroll="y" data-mode="near"></div></div>
    <div class="view" id="v-cat"><div class="page" id="cat-page" data-scroll="y" data-mode="near"></div></div>
    <div class="view" id="v-search"><div class="page" id="search-page" data-scroll="y" data-mode="near"></div></div>
    <div class="view" id="v-homecfg"><div class="page" id="hc-page" data-scroll="y" data-mode="near"></div></div>
    <div class="view" id="v-settings"><div class="page" id="set-page" data-scroll="y" data-mode="near"></div></div>
  </div>

  <div id="player">
    <video id="video" playsinline></video>
    <canvas id="pcv" width="1280" height="720"></canvas>
    <div id="pipwrap"><video id="pipv" muted playsinline></video><canvas id="pipcv" width="480" height="270"></canvas><span id="piplab"></span></div>
    <div id="stats"></div>
    <div id="chat"><div class="chat-h" id="chat-h"></div><div class="msgs" id="msgs"></div></div>
    <div id="pmsg"></div>
    <div class="p-top" id="p-top"></div>
    <div class="p-bottom" id="p-bottom"></div>
    <div id="qmenu" class="gone"></div>
    <div id="adpill"></div>
    <div id="adov"></div>
    <div id="zap"></div>
  </div>

  <div id="toast"></div>
  <div id="modal" class="gone"></div>
  <div id="login" class="gone"></div>
  <div id="boot"><span class="spin big"></span><p>Démarrage…</p></div>
</div>
<script src="vendor/hls.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
